<style>
:root{--bg:#F3F2EF;--fg:#17191A;--mu:#86898B;--ln:#D9D8D3;--ac:#1F3D36;--sf:#FBFAF8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121413;--fg:#ECEBE7;--mu:#8D9092;--ln:#2B2E2D;--ac:#9CC4B6;--sf:#1B1E1D;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121413;--fg:#ECEBE7;--mu:#8D9092;--ln:#2B2E2D;--ac:#9CC4B6;--sf:#1B1E1D;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:300 15px/1.5 Jost,system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:28px 20px 110px}
h1{font:500 46px/1 'Cormorant Garamond',Georgia,serif;margin:0 0 6px;letter-spacing:-.01em}
h2{font:500 26px/1.1 'Cormorant Garamond',Georgia,serif;margin:34px 0 12px}
.mu{color:var(--mu)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--ln);background:none;color:var(--fg);font:inherit;padding:6px 14px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn{font:400 15px Jost,sans-serif;border:1px solid var(--fg);background:none;color:var(--fg);padding:12px 16px;cursor:pointer;flex:1}
.btn.p{background:var(--fg);color:var(--bg)}.btn.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.row{display:flex;gap:8px;margin:14px 0}
.hero{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:var(--ln);border:1px solid var(--ln);margin-top:14px}
.pc{background:var(--sf);padding:14px 10px 10px;cursor:pointer;text-align:center;min-width:0}
.pc:first-child:nth-last-child(odd){grid-column:span 2}
.pc .art{height:150px;display:flex;align-items:center;justify-content:center}
.pc .art svg,.pc .art img{height:100%;max-width:100%;object-fit:contain}
.pc span{display:block;font-size:13px;margin-top:6px}
.rep .pc{outline:2px solid var(--ac);outline-offset:-2px}
.bar{display:grid;grid-template-columns:130px 1fr 38px;gap:10px;align-items:center;font-size:13px;margin:6px 0}
.bar i{display:block;height:2px;background:var(--ln)}.bar i b{display:block;height:2px;background:var(--ac)}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{display:flex;gap:2px;background:var(--ln);border:1px solid var(--ln);cursor:pointer}
.mini div{flex:1;background:var(--sf);height:84px;padding:6px;display:flex;justify-content:center}
.mini svg,.mini img{height:100%;max-width:100%;object-fit:contain}
.day{border-top:1px solid var(--ln);padding:14px 0}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.dh b{font:500 22px 'Cormorant Garamond',serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--ln);border:1px solid var(--ln)}
.grid .pc .art{height:190px}
input[type=range]{width:100%;accent-color:var(--ac)}
input[type=text],select{width:100%;font:inherit;padding:10px;border:1px solid var(--ln);background:var(--sf);color:var(--fg);margin:4px 0 12px;border-radius:0}
.tab{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tab button{flex:1;border:0;background:none;color:var(--mu);font:500 20px 'Cormorant Garamond',serif;padding:14px 0;cursor:pointer}
.tab button.on{color:var(--fg);text-decoration:underline;text-underline-offset:6px}
.fab{position:fixed;right:20px;bottom:calc(70px + env(safe-area-inset-bottom,0px));width:52px;height:52px;border-radius:50%;border:0;background:var(--fg);color:var(--bg);font-size:28px;cursor:pointer;z-index:4}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sw{display:inline-block;width:34px;height:34px;border:1px solid var(--ln);vertical-align:middle;margin-right:2px}
.tip{border-left:2px solid var(--ac);padding:2px 12px;margin:14px 0;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1}
.prev{background:repeating-conic-gradient(var(--ln) 0 25%,var(--sf) 0 50%) 0 0/16px 16px;height:220px;display:flex;justify-content:center}
.prev img{height:100%;object-fit:contain}
.hist{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--ln);padding:10px 0;gap:10px}
.hist .mini{width:55%}.hist .mini div{height:52px;padding:3px}
:root{--bg:#F3F3F7;--fg:#101018;--mu:#7A7B88;--ln:#E3E3EB;--ac:#5B4BFF;--sf:#FFFFFF;--r:26px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D0D12;--fg:#F2F2F7;--mu:#8E8F9C;--ln:#262630;--ac:#8C82FF;--sf:#17171F}}
:root[data-theme="dark"]{--bg:#0D0D12;--fg:#F2F2F7;--mu:#8E8F9C;--ln:#262630;--ac:#8C82FF;--sf:#17171F}
body{font:400 15px/1.5 Onest,system-ui,sans-serif}
#app{max-width:640px;padding:22px 16px 140px}

h2{font:600 18px/1.2 Onest,sans-serif;letter-spacing:-.01em;margin:28px 0 10px}
.chip{border:0;background:var(--sf);font:500 14px Onest,sans-serif;padding:9px 16px}.chip.on{background:var(--fg);color:var(--bg)}
.btn{font:500 15px Onest,sans-serif;border:0;background:var(--sf);border-radius:18px;padding:15px 16px}.btn.p{background:var(--fg);color:var(--bg)}.btn.on{background:var(--ac);color:#fff}
.pc{background:color-mix(in srgb,var(--c,#9a9aa5) 16%,var(--sf));border-radius:var(--r);overflow:hidden;border:0;padding:14px 10px 12px}
.pc span{font-weight:500;font-size:13px;margin-top:8px}
.hero{gap:10px;background:none;border:0}
.grid{grid-template-columns:repeat(2,1fr);gap:12px;background:none;border:0;margin-top:6px}

.grid .pc{grid-column:auto!important}.grid .pc .art{height:170px}

.mini{gap:6px;background:none;border:0}.mini div{background:var(--bg);border-radius:14px}
.day{background:var(--sf);border:0;border-radius:var(--r);padding:16px;margin-bottom:12px}.dh b{font:600 17px Onest,sans-serif}
.tip{border:0;background:var(--sf);border-radius:16px;padding:12px 14px}
input[type=text],select{border:0;border-radius:14px;padding:13px;background:var(--sf)}
.sheet>div{background:var(--bg);border-radius:30px 30px 0 0}.prev{border-radius:20px;overflow:hidden}
.sw{border-radius:50%}
.tab{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;padding:8px 10px;border:1px solid var(--ln);border-radius:99px;background:color-mix(in srgb,var(--sf) 80%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 12px 40px rgba(20,20,50,.16);align-items:center}
.tab button{display:flex;flex-direction:column;align-items:center;gap:2px;font:500 11px Onest,sans-serif;padding:6px 0;text-decoration:none!important;color:var(--mu)}.tab button svg{width:23px;height:23px}.tab button.on{color:var(--ac)}
.tab .plus{flex:none;width:56px;height:56px;border-radius:50%;background:var(--ac);color:#fff;font:300 34px/1 Onest,sans-serif;margin:-24px 8px 0;padding:0;box-shadow:0 10px 26px color-mix(in srgb,var(--ac) 45%,transparent);justify-content:center}
.pc:has(.art img){background:#fff;padding:0 0 12px;color:#101018}.pc .art:has(img),.grid .pc .art:has(img){height:auto}
.pc .art img{width:100%;height:auto;aspect-ratio:4/5;object-fit:cover}.hero .pc .art img{width:auto;max-height:270px;max-width:100%;margin:0 auto;display:block}
.mini img{background:#fff;border-radius:8px}.prev{background:#fff}.prev img{height:100%;object-fit:contain}
.pc:has(.art img){padding:0 0 12px;background:var(--sf);color:var(--fg)}.pc:has(.art img) span{padding:0 10px;margin-top:8px}
.pc .art img{aspect-ratio:3/4;object-fit:cover}.hero .pc .art img{width:100%;max-width:none;max-height:320px}
.mini img{background:none}.prev{height:auto!important;max-height:56vh;background:var(--sf)}.prev img{height:auto;max-height:56vh;max-width:100%}
.prev{display:block!important;max-height:none;overflow:hidden;border-radius:20px}.prev img{display:block;width:100%;height:auto;max-height:none;max-width:none}

.fbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin:10px -16px 8px;padding:6px 16px 2px}
.fbar .chips{padding:2px 0 6px}.fbar .chip{padding:7px 14px;font-size:13.5px}.dv{flex:none;width:1px;background:var(--ln);margin:4px 4px}

#zv{position:fixed;inset:0;background:#000;z-index:30;touch-action:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
#zi{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;user-select:none;-webkit-user-drag:none;will-change:transform}
